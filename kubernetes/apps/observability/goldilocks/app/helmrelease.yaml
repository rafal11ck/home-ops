---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: goldilocks
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 10.5.0
  url: oci://ghcr.io/home-operations/charts-mirror/goldilocks
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: goldilocks
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controller:
      flags:
        on-by-default: true
      rbac:
        enableArgoproj: false
    dashboard:
      flags:
        on-by-default: true
        enable-cost: false
      rbac:
        enableArgoproj: false
      httpRoute:
        enabled: true
        parentRefs:
          - name: internal
            namespace: envoy-gateway-system
            sectionName: https-subdomains
        hostnames:
          - goldilocks.${SECRET_DOMAIN}
