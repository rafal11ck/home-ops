[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
ROOT_DIR = "{{config_root}}"
KUBERNETES_DIR = '{{config_root}}/kubernetes'
SCRIPTS_DIR = '{{config_root}}/scripts'
BOOTSTRAP_DIR = '{{config_root}}/bootstrap'
TALOS_DIR = '{{config_root}}/talos'
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"

[tasks.deps]
description = "Install dependencies"
run = "uv pip install -r requirements.txt"

[tools]
# Template tools
python = "3.15.0"
uv = "latest"
# Operations tools
"aqua:cloudflare/cloudflared" = "2026.10.0"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.6"
"aqua:getsops/sops" = "3.13.3"
"aqua:go-task/task" = "3.54.0"
"aqua:helm/helm" = "4.3.0"
"aqua:helmfile/helmfile" = "1.8.1"
"aqua:jqlang/jq" = "1.7.1"
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:kubernetes/kubectl" = "1.33.1"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:siderolabs/talos" = "1.14.2"
"aqua:yannh/kubeconform" = "0.8.0"
"github:a8m/envsubst" = "1.4.3"
"github:cilium/cilium-cli" = "0.20.1"
"github:cilium/hubble" = "1.19.4"
"github:derailed/k9s" = "0.51.0"
"github:postfinance/topf" = "v0.6.1"